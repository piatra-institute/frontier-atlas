[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conway99-research"
version = "0.1.0"
description = "Exact fixed-vertex reduction, verifiers, case audit, and OPB encoding for Conway's 99-graph problem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
conway99 = "conway99.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
